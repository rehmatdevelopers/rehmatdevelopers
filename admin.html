<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Control Panel | Rehmat Developers</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* Premium Admin Theme */
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      margin: 0;
      background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0b0f19 70%);
    }
    
    /* Login Screen Container */
    #adminLoginWrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .admin-login-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .admin-login-card img {
      height: 90px;
      margin-bottom: 20px;
    }
    .admin-login-card h2 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: #fff;
    }
    .admin-login-card p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }
    .form-group-admin {
      margin-bottom: 18px;
      text-align: left;
    }
    .form-group-admin label {
      display: block;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .form-group-admin input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.3s;
    }
    .form-group-admin input:focus {
      border-color: #00d4ff;
    }
    .btn-login {
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      color: #fff;
      border: none;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.3s;
    }
    .btn-login:hover {
      opacity: 0.9;
    }
    
    /* Dashboard Screen */
    #adminDashboardWrapper {
      display: none;
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 30px;
    }
    .dash-header h1 {
      font-size: 1.8rem;
      margin: 0;
      color: #fff;
    }
    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-logout:hover {
      background: #ef4444;
      color: #fff;
    }
    
    /* Reviews Table */
    .table-responsive {
      overflow-x: auto;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 1px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    th {
      background: rgba(15, 23, 42, 0.8);
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    td {
      color: #cbd5e1;
      font-size: 0.95rem;
    }
    .delete-action-btn {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .delete-action-btn:hover {
      background: #ef4444;
      color: #fff;
    }
    .loading-text {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- 1. SECURE LOGIN SCREEN -->
  <div id="adminLoginWrapper">
    <div class="admin-login-card">
      <img src="images/logo.png.png" alt="Rehmat Developers Logo" onerror="this.src=''">
      <h2>Admin Control Panel</h2>
      <p>Secure login for Muhammad Waleed.</p>
      
      <form id="adminLoginForm">
        <div class="form-group-admin">
          <label for="adminEmail">Admin Email</label>
          <input type="email" id="adminEmail" required placeholder="admin@example.com">
        </div>
        <div class="form-group-admin">
          <label for="adminPass">Password</label>
          <input type="password" id="adminPass" required placeholder="••••••••">
        </div>
        
        <div id="loginMsg" style="display:none; color:#f87171; background:rgba(239,68,68,0.1); padding:10px; border-radius:8px; font-size:0.85rem; margin-bottom:15px; border:1px solid rgba(239,68,68,0.3);"></div>
        
        <button type="submit" class="btn-login" id="loginBtn">
          <i class="fas fa-lock" style="margin-right:8px;"></i> Access Dashboard
        </button>
      </form>
    </div>
  </div>

  <!-- 2. MAIN DASHBOARD SCREEN -->
  <div id="adminDashboardWrapper">
    <div class="dash-header">
      <div>
        <h1>Rehmat Developers - Dashboard</h1>
        <p style="color:#94a3b8; margin:5px 0 0 0; font-size:0.95rem;">Manage Client Reviews Globally</p>
      </div>
      <button class="btn-logout" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i> Secure Logout</button>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Client Name</th>
            <th>Service</th>
            <th>Rating</th>
            <th>Review Message</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="reviewsTableBody">
          <tr>
            <td colspan="6" class="loading-text"><i class="fas fa-spinner fa-spin"></i> Loading reviews from database...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- FIREBASE SDKs (v10 compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>
    // ===== EXACT FIREBASE KEYS =====
    const firebaseConfig = {
      apiKey: "AIzaSyAILcD4WQVlf6_2qRUeecZYRjgD6CmnzhE",
      authDomain: "rehmat-developers.firebaseapp.com",
      projectId: "rehmat-developers",
      storageBucket: "rehmat-developers.firebasestorage.app",
      messagingSenderId: "70200725412",
      appId: "1:70200725412:web:2f8353934bb2cfb996fb31",
      measurementId: "G-0NKGMFJLLG"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // DOM Elements
    const loginWrapper = document.getElementById('adminLoginWrapper');
    const dashWrapper = document.getElementById('adminDashboardWrapper');
    const loginForm = document.getElementById('adminLoginForm');
    const loginMsg = document.getElementById('loginMsg');
    const loginBtn = document.getElementById('loginBtn');

    // 1. AUTHENTICATION LISTENER
    auth.onAuthStateChanged(user => {
      if (user) {
        // User is logged in -> Show Dashboard
        loginWrapper.style.display = 'none';
        dashWrapper.style.display = 'block';
        fetchAdminReviews(); // Load reviews
      } else {
        // User is logged out -> Show Login
        loginWrapper.style.display = 'flex';
        dashWrapper.style.display = 'none';
      }
    });

    // 2. LOGIN FUNCTION
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const pass = document.getElementById('adminPass').value.trim();

      loginMsg.style.display = 'none';
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
      loginBtn.disabled = true;

      auth.signInWithEmailAndPassword(email, pass)
        .then(() => {
          loginBtn.innerHTML = '<i class="fas fa-lock"></i> Access Dashboard';
          loginBtn.disabled = false;
        })
        .catch(error => {
          loginMsg.style.display = 'block';
          loginMsg.innerHTML = '<i class="fas fa-exclamation-triangle"></i> ' + error.message;
          loginBtn.innerHTML = '<i class="fas fa-lock"></i> Access Dashboard';
          loginBtn.disabled = false;
        });
    });

    // 3. LOGOUT FUNCTION
    function logoutAdmin() {
      auth.signOut();
    }

    // 4. FETCH REVIEWS FROM FIRESTORE
    function fetchAdminReviews() {
      const tbody = document.getElementById('reviewsTableBody');
      
      // Live listener for real-time updates
      db.collection('reviews').orderBy('createdAt', 'desc').onSnapshot(snap => {
        if (snap.empty) {
          tbody.innerHTML = '<tr><td colspan="6" class="loading-text">No reviews found in database.</td></tr>';
          return;
        }

        tbody.innerHTML = snap.docs.map(doc => {
          const d = doc.data();
          const stars = '★'.repeat(d.rating || 5) + '☆'.repeat(5 - (d.rating || 5));
          
          return `
            <tr>
              <td style="white-space:nowrap; color:#94a3b8;">${d.date || 'N/A'}</td>
              <td><strong style="color:#f8fafc;">${escapeHtml(d.name)}</strong></td>
              <td><span style="background:rgba(59, 130, 246, 0.1); color:#3b82f6; padding:4px 8px; border-radius:6px; font-size:0.8rem;">${escapeHtml(d.service || 'Client')}</span></td>
              <td style="color:#f59e0b; font-size:1.1rem; letter-spacing:1px;">${stars}</td>
              <td style="max-width:350px; line-height:1.6; font-style:italic;">"${escapeHtml(d.message)}"</td>
              <td>
                <button class="delete-action-btn" onclick="deleteReview('${doc.id}')">
                  <i class="fas fa-trash-alt"></i> Delete
                </button>
              </td>
            </tr>
          `;
        }).join('');
      }, error => {
        tbody.innerHTML = `<tr><td colspan="6" class="loading-text" style="color:#ef4444;">Error loading reviews: ${error.message}</td></tr>`;
      });
    }

    // 5. SECURE DELETE FUNCTION
    function deleteReview(docId) {
      if (confirm("Are you absolutely sure you want to delete this review? This action cannot be undone.")) {
        db.collection('reviews').doc(docId).delete()
          .then(() => {
            // Success (onSnapshot will automatically remove the row)
            console.log("Deleted document ID: ", docId);
          })
          .catch(err => {
            alert("Delete failed! Ensure you are logged in. Error: " + err.message);
          });
      }
    }

    // Security helper
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
